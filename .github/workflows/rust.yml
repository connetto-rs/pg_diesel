name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  generated:
    name: Generated version packages
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        components: rustfmt
    - name: Check the version packages match versioned/
      run: cargo xtask generate --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: each PostgreSQL version alone
            feature-sets: postgres-14 postgres-15 postgres-16 postgres-17 postgres-18
          - name: every feature
            feature-sets: postgres-14,postgres-15,postgres-16,postgres-17,postgres-18,serde,routines
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Run clippy (${{ matrix.name }})
      env:
        FEATURE_SETS: ${{ matrix.feature-sets }}
      run: |
        failed=""
        for features in $FEATURE_SETS; do
          echo "::group::$features"
          cargo clippy --workspace --all-targets --no-default-features --features "$features" -- -D warnings || failed="$failed $features"
          echo "::endgroup::"
        done
        if [ -n "$failed" ]; then
          echo "::error::clippy failed for$failed"
          exit 1
        fi

  msrv:
    name: Clippy on the declared rust-version
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Install Rust
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: "1.95.0"
        components: clippy
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Run clippy with every feature
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Check documentation
      run: cargo doc --workspace --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings

  coverage:
    name: Test and coverage (PostgreSQL 14 to 18)
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: cargo-llvm-cov
    - name: Test every compiled version and measure coverage
      run: cargo llvm-cov --workspace --all-targets --all-features --lcov --output-path target/lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/lcov.info
        fail_ci_if_error: false
