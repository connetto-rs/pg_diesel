name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.rust }}, postgres-${{ matrix.postgres }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]
        postgres: [14, 15, 16, 17, 18]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Build and Test (postgres-${{ matrix.postgres }})
      run: cargo test --release --no-default-features --features postgres-${{ matrix.postgres }}
    - name: Build and Test with serde (postgres-${{ matrix.postgres }})
      run: cargo test --release --no-default-features --features "postgres-${{ matrix.postgres }},serde"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy (postgres-${{ matrix.postgres }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Run clippy (postgres-${{ matrix.postgres }})
      run: cargo clippy --all-targets --no-default-features --features postgres-${{ matrix.postgres }} -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev libpq-dev
    - name: Check documentation
      run: cargo doc --no-deps --document-private-items
      env:
        RUSTDOCFLAGS: -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
      with:
        tool: cargo-llvm-cov
    - name: Generate coverage for each PostgreSQL version
      run: |
        mkdir -p target/coverage
        for version in 14 15 16 17 18; do
          cargo llvm-cov --workspace --all-targets --no-default-features --features "postgres-$version" \
            --lcov --output-path "target/coverage/postgres-$version.lcov"
        done
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: target/coverage/postgres-14.lcov,target/coverage/postgres-15.lcov,target/coverage/postgres-16.lcov,target/coverage/postgres-17.lcov,target/coverage/postgres-18.lcov
        fail_ci_if_error: false
