[package]
name = "pg_diesel"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "main", features = [
  "postgres",
  "extras",
  "64-column-tables",
  "numeric",
] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"], optional = true }
bigdecimal = { version = "0.4", features = ["serde"] }
sql-traits = { git = "https://github.com/connetto-rs/sql-traits", branch = "main" }
sqlparser = { version = "0.63", features = ["serde", "visitor"] }
thiserror = "2.0.17"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["full"] }
testcontainers = { version = "0.28.0" }
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"
tempfile = "3.20"

# `sql-traits` main tracks `sqlparser` upstream main, which carries AST changes
# not yet in a release. The `sqlparser` requirement names the version upstream
# main declares, otherwise the patch does not apply to this crate.
# Patching at the workspace root keeps every dependent on one `sqlparser`, so
# AST types stay compatible across crate boundaries.
[patch.crates-io]
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }

[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
dead_code = "deny"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
struct_excessive_bools = "allow"
should_panic_without_expect = "allow"
duplicated_attributes = "allow"
doc_markdown = "warn"
unnecessary_cast = "forbid"
trait_duplication_in_bounds = "forbid"
redundant_clone = "forbid"
redundant_closure = "forbid"
extra_unused_type_parameters = "forbid"
type_repetition_in_bounds = "forbid"
clone_on_copy = "forbid"
panic = "allow"
todo = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
as_underscore = "deny"
missing_docs_in_private_items = "deny"
unimplemented = "deny"
assertions_on_result_states = "deny"
big_endian_bytes = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "forbid"
dbg_macro = "deny"
pedantic = { level = "deny", priority = -1 }
redundant_guards = "deny"
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

[features]
default = ["serde", "postgres-18"]
serde = ["dep:serde"]
postgres-14 = []
postgres-15 = []
postgres-16 = []
postgres-17 = []
postgres-18 = []
# Whether to include routines metadata, which is a rather large
# table with 88 columns.
routines = ["diesel/128-column-tables"]
